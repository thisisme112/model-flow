<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Model Flow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
/* Layout: one framework figure across the page — boxes are operations, the small pictures between them are data.
   Controls sit above it; the current step's input / operation / output is spelled out below.
   Single paper look by choice. Restyle by changing the tokens below. */
:root { color-scheme: light;
  --paper: #f7f6f1; --grid: #e4e9ee; --ink: #1b2a41; --pencil: #6f7782; --red: #c8372d;
  --k-conv: #d6e4f5; --k-pool: #d5ecdb; --k-dense: #e5dbf3; --k-act: #f7eabb; --k-norm: #e9e5da; --k-attn: #f8d8cf;
  --k-shape: #e0e3e6; --k-loss: #f5cfca; --k-group: #fdfcf8; --k-other: #fdfcf8;
  --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --kai: "LXGW WenKai", "KaiTi", "STKaiti", "Kaiti SC", "Noto Serif SC", serif;
  --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box }
body { margin: 0; color: var(--ink); font: 16px/1.75 var(--serif); font-variant-numeric: tabular-nums; padding-block: 2rem 4rem; padding-inline: 16px;
  background: linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 24px, linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 100%, var(--paper) }
.page { max-width: 82rem; margin-inline: auto; display: grid; gap: 1.5rem; grid-template-columns: minmax(0, 1fr) }
h1 { font-weight: 900; font-size: clamp(1.6rem, 4vw, 2.3rem); line-height: 1.25; margin: 0; text-wrap: balance }
h2 { font-weight: 600; font-size: 1.25rem; line-height: 1.3; margin: 0; overflow-wrap: anywhere }
p { margin: 0 }
.src { font-size: .8rem; letter-spacing: .12em; color: var(--pencil) }
.lede { max-width: 40em; margin-top: .5rem }
.small { font-size: .8rem; color: var(--pencil); line-height: 1.5 }
.mono { font-family: var(--mono); font-size: .78rem }
button { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink); border-radius: 2px; padding: .1rem .75rem; cursor: pointer }
button:disabled { color: var(--pencil); border-color: var(--pencil); cursor: default }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px }
input[type=range] { accent-color: var(--red) }
canvas, img { image-rendering: pixelated; display: block; max-width: 100%; height: auto }

.bar { display: flex; flex-wrap: wrap; gap: .8rem 2.5rem; align-items: center }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .6rem; font-size: .9rem }
.ctl label { font-weight: 600 }
[hidden] { display: none !important }
#level, #variant { width: 8rem }
#step { width: 10rem }
#play { background: var(--ink); color: var(--paper); min-width: 5.4rem }

/* hand-inked outline on a pseudo-element, so the contents stay sharp */
.inked { position: relative }
.inked::before, .card::before { content: ""; position: absolute; inset: 0; border: 1.5px solid var(--ink); border-radius: 4px; filter: url(#rough); pointer-events: none }

/* The figure is laid out like text: steps are inline boxes that wrap at the page edge, and a module is an inline
   span around its steps, so a module that does not fit on one row carries on in the next with its frame left open.
   --nt / --nb: room each row keeps above / below its centre line; --shift: half their difference, because a frame
   hangs from the row's baseline, which sits that far above the centre line. --up / --dn: how far a frame reaches
   above / below that centre line.
   Two things are boxes instead of text, so they make only their own row taller: .par, a set of branches (lanes one
   under the other, with a gutter left and right for the arrows in and out), and .box, a module with branches inside it.
   Every lane and every .box is a small figure of its own: its own rows, its own --nt / --nb. */
.wrap { overflow-x: auto; overflow-y: hidden }
.stage { position: relative; font-size: 0; line-height: 0; padding-block: 10px }
#wires { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none }
.frame { position: relative; padding: calc(var(--up) - var(--shift)) 6px calc(var(--dn) + var(--shift)); border: 1.5px dashed var(--pencil); border-radius: 8px; background: rgba(27, 42, 65, .035) }
.par, .box { vertical-align: middle; max-width: calc(100% - 8px); margin: 6px 4px; text-align: left }
.par { display: inline-flex; flex-direction: column; padding: 12px 16px 6px }
.box { display: inline-block; padding: 10px 6px 4px }
.lane { display: block }
#wires .w { fill: none; stroke: var(--ink); stroke-width: 1.5; marker-end: url(#ah) }
#wires .w[data-s=todo] { stroke: var(--pencil); opacity: .35; marker-end: url(#ah-todo) }
#wires .w[data-s=now] { stroke: var(--red); stroke-width: 2; marker-end: url(#ah-now) }
.glabel { position: absolute; left: 8px; top: 0; transform: translateY(-50%); background: var(--paper); border: 0; padding: 0 .4rem; font: 600 12px/1.4 var(--serif); white-space: nowrap }
.glabel span { color: var(--pencil); font-weight: 400 }
.card { position: relative; display: inline-block; vertical-align: middle; width: 84px; height: 106px; margin: calc(var(--nt) - 53px) 10px calc(var(--nb) - 53px); background: var(--paper); border-radius: 4px }
.card.group { box-shadow: 5px 5px 0 -1px var(--paper), 5px 5px 0 0 var(--pencil) }
.card .pick { width: 100%; height: 100%; display: grid; grid-template-rows: 34px 1fr auto; justify-items: center; align-items: center; border: 0; background: none; padding: 0 0 4px; font: 10px/1.2 var(--mono); color: var(--pencil) }
.card .head { align-self: stretch; justify-self: stretch; display: grid; place-content: center; overflow: hidden; padding: 0 3px; background: var(--k); border-radius: 4px 4px 0 0; font: 600 12px/1.15 var(--serif); color: var(--ink); text-align: center; overflow-wrap: anywhere }
.card .head small { display: block; font: 400 9.5px/1.25 var(--mono); color: var(--pencil) }
.card .head.long { font-size: 10px; line-height: 1.1 }
.card.in .head { background: none }
.card .exp { position: absolute; right: -9px; top: -9px; width: 20px; height: 20px; border-radius: 50%; padding: 0; display: grid; place-items: center; font: 600 13px/1 var(--mono) }
.card[data-s=todo] { opacity: .28 }
.card[data-s=now]::before { border-color: var(--red); border-width: 2.5px }
.card[data-s=now] .head { color: var(--red) }
.thumb { width: 60px; height: 54px; display: grid; place-items: center }
.thumb img { max-width: 56px; max-height: 56px; image-rendering: auto }
.thumb .num { font: 600 17px var(--serif); color: var(--ink) }
.thumb .tk { font-size: 10px; color: var(--ink); text-align: center; overflow-wrap: anywhere }
.thumb .multi { display: flex; gap: 8px; align-items: center }
.stack { position: relative }
.stack canvas { position: absolute; background: var(--paper); outline: 1px solid var(--ink) }
.dot { position: absolute; left: 0; top: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--red); opacity: 0; offset-rotate: 0deg; pointer-events: none }

.legend { display: flex; flex-wrap: wrap; gap: .3rem 1.2rem; font-size: .8rem; color: var(--pencil) }
.legend i { display: inline-block; width: .9rem; height: .9rem; margin-right: .35rem; vertical-align: -2px; border: 1px solid var(--ink); border-radius: 2px; background: var(--k) }
figcaption, .cap { max-width: 42em; font-size: .95rem }
figure { margin: 0; display: grid; gap: .6rem; min-width: 0 }

.detail { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap: 1.2rem 0; padding: 1.2rem 0; background: color-mix(in srgb, var(--paper) 88%, transparent) }
.col { padding: 0 1.2rem; display: grid; gap: .8rem; align-content: start; min-width: 0; border-left: 1px dashed var(--pencil) }
.col:first-child { border-left: 0 }
.col h3 { margin: 0; font-size: .8rem; font-weight: 400; letter-spacing: .15em; color: var(--pencil) }
.io { display: grid; gap: .4rem; min-width: 0 }
.lab { display: flex; justify-content: space-between; gap: .6rem; font-size: .8rem; color: var(--pencil) }
.lab span:first-child { color: var(--ink); font-weight: 600 }
.maps { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start }
.maps canvas { outline: 1px solid var(--grid) }
.scroll { overflow-x: auto }
.ngrid { display: grid; gap: 1px; width: max-content }
.ngrid span { font: 10px/1.5 var(--mono); min-width: 2.2rem; padding: 0 .2rem; text-align: right; outline: 1px solid var(--grid) }
.big { font-size: 2.6rem; font-weight: 900; line-height: 1.1 }
.bars { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .2rem .5rem; align-items: center; font: .78rem/1.2 var(--mono) }
.bars .track { position: relative; height: .8rem }
.bars i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--ink) }
.bars i.neg { background: var(--red) }
.bars.signed .track { background: linear-gradient(var(--pencil), var(--pencil)) 50% 0 / 1px 100% no-repeat }
.bars .v { text-align: right }
.tokens { display: flex; flex-wrap: wrap; gap: .3rem }
.tokens span { font: .8rem var(--mono); border: 1px solid var(--pencil); padding: 0 .4rem; border-radius: 3px }
.cap { font-family: var(--kai); font-size: 1.08rem }
.cap b { font-family: var(--serif); font-size: .95rem; font-weight: 600 }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="2.5"/></filter></svg>

<div class="page">
  <header>
    <p class="src" id="src"></p>
    <h1 id="title"></h1>
    <p class="lede" id="summary"></p>
    <p class="lede" id="example"></p>
  </header>
  <section class="bar">
    <div class="ctl"><label for="level">详略</label><span>概括</span><input type="range" id="level" min="1" step="1"><span>详细</span><output id="lvl" for="level" class="small"></output></div>
    <div class="ctl"><button id="first" aria-label="回到起点">⏮</button><button id="prev">← 上一步</button><button id="play"></button><button id="next">下一步 →</button><input type="range" id="step" min="0" step="1" aria-label="当前步骤"><output id="pos" for="step" class="small"></output></div>
    <div class="ctl" id="vctl" hidden><label for="variant" id="vlab"></label><input type="range" id="variant" min="0" step="1"><output id="vname" for="variant" class="small"></output></div>
    <div class="ctl"><button id="export">导出 SVG</button></div>
  </section>
  <figure>
    <div class="wrap"><div class="stage" id="stage"></div></div>
    <div class="legend" id="legend"></div>
    <figcaption><b>怎么读这张图。</b>从左到右、从上到下读。每个方框是一步处理：上面是名字，下面的小图是它输出的数据，最底下是数据的形状。虚线框是一个模块：点“−”把它收成一个方框，点“＋”再展开；一行放不下时会折到下一行，右边不封口表示还没完。红色是数据现在所在的位置，颜色淡的是还没走到的。</figcaption>
  </figure>
  <section class="detail inked" id="detail"></section>
  <p class="cap" id="cap"></p>
</div>

<script type="application/json" id="spec">{"title":"Model Flow","root":{"name":"root","children":[{"name":"输入","type":"Input"},{"name":"model","type":"Model"}]}}</script>
<script>
const SPEC = JSON.parse(document.getElementById('spec').textContent);
const INK = [27, 42, 65], RED = [200, 55, 45], T = 1800;
const KINDS = [['loss', /loss|entropy/i, '损失'], ['attn', /attention|attn/i, '注意力'], ['conv', /conv/i, '卷积'], ['pool', /pool|sampl|interpolat/i, '池化 / 采样'],
  ['norm', /norm|dropout/i, '归一化 / Dropout'], ['act', /relu|gelu|silu|swish|sigmoid|tanh|softmax/i, '激活'], ['dense', /linear|dense|embed|matmul|bmm/i, '全连接 / 嵌入'],
  ['shape', /flatten|reshape|view|permute|transpose|squeeze|cat|stack|add|mul|sub|getitem/i, '形状 / 合并']];
const TYPE_DESC = {
  input: '送进来的原始数据。', conv: '卷积：用小窗口（卷积核）在输入上滑动，每个位置算一次加权和，用来找局部图案。',
  convtranspose: '转置卷积：和卷积相反，把特征图放大。', relu: '激活函数：负数变成 0，正数不变。', gelu: '激活函数：和 ReLU 类似，但在 0 附近是平滑过渡。',
  sigmoid: '把每个数压到 0 和 1 之间。', tanh: '把每个数压到 −1 和 1 之间。', maxpool: '最大池化：每个小块只留最大的那个数，缩小尺寸，保留最强的响应。',
  avgpool: '平均池化：每个小块取平均，缩小尺寸。', adaptiveavgpool: '自适应平均池化：不管输入多大，都平均成固定的大小。',
  flatten: '展平：把多维数据排成一排，数值不变。', linear: '全连接层：输出的每个数都是全部输入的加权和再加偏置。',
  softmax: '把一组分数变成加起来等于 1 的概率。', logsoftmax: '先把分数变成概率，再取对数。结果都是负数，越接近 0 概率越高。',
  batchnorm: '批归一化：把每个通道的数值调整到均值 0、方差 1 附近。', layernorm: '层归一化：把每个样本自己的数值调整到均值 0、方差 1 附近。',
  dropout: '训练时随机把一部分数变成 0，防止过拟合；推理时原样通过。', embedding: '查表：把每个词元的编号换成一个向量。',
  multiheadattention: '注意力：每个位置按相关程度，从其他位置汇总信息。', add: '逐元素相加：两路数据在这里汇合，残差连接就是这样做的。',
  cat: '拼接：把两路数据沿某个维度接在一起。', nllloss: '负对数似然损失：取出正确类别的对数概率，去掉负号。',
  crossentropy: '交叉熵损失：正确类别的概率越低，损失越大。', crossentropyloss: '交叉熵损失：正确类别的概率越低，损失越大。', mseloss: '均方误差：预测和目标之差的平方的平均。',
};

const $ = id => document.getElementById(id);
const el = (tag, cls, ...kids) => { const e = document.createElement(tag); if (cls) e.className = cls; e.append(...kids.flat(3).filter(k => k != null && k !== false)); return e; };
const svg = (tag, attrs) => { const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
const small = s => el('p', 'small', s);
const f = v => Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 10 ? v.toFixed(1) : v.toFixed(2);
const absmax = d => d.reduce((m, v) => Math.max(m, Math.abs(v)), 1e-12);

// ---- the model: a tree of steps, plus data-flow edges between its leaves
const all = [];
(function walk(n, depth, parent) {
  n.depth = depth; n.parent = parent; n.id ??= parent && parent.parent ? parent.id + '/' + n.name : n.name;
  all.push(n); (n.children || []).forEach(c => walk(c, depth + 1, n));
})(SPEC.root, 0, null);
const byId = new Map(all.map(n => [n.id, n]));
const isGroup = n => !!(n.children && n.children.length);
const isInput = n => !isGroup(n) && n.type === 'Input';
const firstLeaf = n => isGroup(n) ? firstLeaf(n.children[0]) : n;
const lastLeaf = n => isGroup(n) ? lastLeaf(n.children.at(-1)) : n;
const leaves = all.filter(n => !isGroup(n)), groups = all.filter(isGroup);
const outs = new Map(leaves.map(l => [l, []]));
leaves.forEach((b, i) => {       // "from" on a leaf, or on a group it is the first leaf of; default: the previous leaf
  let from = b.from;
  for (let p = b.parent; from === undefined && p && firstLeaf(p) === b; p = p.parent) from = p.from;
  const src = from !== undefined ? from.map(id => { if (!byId.has(id)) throw Error(`"${b.id}" 的 from 里找不到 "${id}"`); return lastLeaf(byId.get(id)); })
    : isInput(b) || !i ? [] : [leaves[i - 1]];
  for (const a of src) outs.get(a).push(b);
});
const norm = s => (s || '').toLowerCase().replace(/\dd|_|\d/g, '');
const descOf = n => n.desc || TYPE_DESC[norm(n.type)] || (isGroup(n) ? '一个模块，里面还有更细的步骤。' : '');
const kindOf = n => n.kind || (isGroup(n) ? 'group' : (KINDS.find(k => k[1].test(n.type || '')) || ['other'])[0]);
const gnorm = n => typeof n.grad === 'number' ? n.grad : n.grad?.data ? Math.hypot(...n.grad.data) : null;
const shapeStr = t => !t ? '' : t.tokens && !t.shape ? t.tokens.length + ' 项' : (t.full ?? t.shape ?? []).join('×') || '1 个数';

// ---- what is on screen: a group is either open (drawn as a dashed frame) or closed (drawn as one box)
// the slider position that opens a group. Branches that are single steps open together with the module around them:
// there is nothing more inside them, so a stop of their own would only add a click.
const levelOf = g => g.depth + 1 - (g.parallel && !g.children.some(isGroup) ? 1 : 0);
const maxLevel = Math.max(1, ...groups.map(levelOf));
let open = new Set([SPEC.root]), step = 0, V = null, G = null, timer = 0, anims = [];
const rep = n => { let r = n; for (let p = n.parent; p; p = p.parent) if (!open.has(p)) r = p; return r; };
const shown = n => !n.parent || (open.has(n.parent) && shown(n.parent));
const framed = n => n !== SPEC.root && open.has(n) && shown(n);
const boxed = n => framed(n) && !n.parallel && n.children.some(c => framed(c) && (c.parallel || boxed(c)));   // an open module with branches showing inside it
const firstOp = n => isGroup(n) ? n.children.map(firstOp).find(Boolean) : isInput(n) ? null : n;
// siblings built the same way form a run: [position in it, its length]. Of three or more, the slider opens only the first.
const sig = n => (n.type || '') + (isGroup(n) ? '(' + n.children.map(sig) + ')' : '');
const run = g => { const s = g.parent.children, same = j => s[j] && isGroup(s[j]) && sig(s[j]) === sig(g); let i = s.indexOf(g), a = i, b = i; while (same(a - 1)) a--; while (same(b + 1)) b++; return [i - a, b - a + 1]; };
const folded = g => { const [i, n] = g.parent ? run(g) : [0, 1]; return i > 0 && n > 2; };
const chain = n => { const c = []; for (let p = n.parent; p; p = p.parent) c.push(p); return c; };
const lca = ns => chain(ns[0]).find(p => ns.every(n => chain(n).includes(p)));
function view() {
  const ops = [], seen = new Set(), data = [];
  for (const l of leaves) { const r = rep(l); if (!seen.has(r)) { seen.add(r); if (!isInput(r)) ops.push(r); } }
  for (const a of leaves) {     // one data node per tensor that is visible from outside the box that made it
    const r = rep(a), cons = [...new Set(outs.get(a).map(rep))].filter(c => c !== r);
    if (isInput(r) || cons.length || !outs.get(a).length) data.push({ leaf: a, prod: isInput(r) ? null : r, cons });
  }
  return { ops, data };
}

// ---- drawing tensors
function cv(d, w, h, max, cssW) {
  const c = el('canvas'); c.width = w; c.height = h; c.style.width = cssW + 'px';
  const x = c.getContext('2d'), im = x.createImageData(w, h);
  for (let i = 0; i < w * h; i++) { const v = d[i] || 0; im.data.set([...(v < 0 ? RED : INK), Math.min(255, Math.abs(v) / max * 255)], i * 4); }
  x.putImageData(im, 0, 0); return c;
}
function miniBars(d, max) {
  const c = el('canvas'), n = d.length, bw = Math.max(2, Math.floor(52 / n)); c.width = n * bw; c.height = 40; c.style.width = n * bw + 'px';
  const x = c.getContext('2d');
  d.forEach((v, i) => { const hh = Math.max(1, Math.abs(v) / max * 40); x.fillStyle = `rgb(${v < 0 ? RED : INK})`; x.fillRect(i * bw, 40 - hh, bw - 1, hh); });
  return c;
}
function thumb(t) {
  if (!t) return el('span', 'tk', '—');
  if (t.image) { const i = el('img'); i.src = t.image; i.alt = ''; return i; }
  if (t.tokens) { const few = t.tokens.slice(0, 3).join(' '), fits = few.length <= 24; return el('span', 'tk', fits ? few + (t.tokens.length > 3 ? ' …' : '') : t.tokens[0].slice(0, 22) + ' …'); }
  const d = t.data;
  if (!d) return el('span', 'tk', '…');
  if (d.length === 1) return el('span', 'num', f(d[0]));
  const max = absmax(d), s = t.shape?.length ? t.shape : [d.length];
  if (s.length < 2) { if (d.length <= 16) return miniBars(d, max); const strip = cv(d, 1, d.length, max, 12); strip.style.height = '46px'; return strip; }
  const W = s.at(-1), H = s.at(-2), n = H * W, C = Math.min(3, d.length / n), k = 40 / Math.max(H, W), box = el('span', 'stack');
  const hh = H * k < 14 ? Math.min(40, H * 5) : H * k;     // a few long rows (the positions of a short sequence): taller, so the rows can be told apart
  box.style.width = W * k + (C - 1) * 6 + 'px'; box.style.height = hh + (C - 1) * 6 + 'px';
  for (let c = C - 1; c >= 0; c--) { const m = cv(d.slice(c * n, (c + 1) * n), W, H, max, W * k); m.style.height = hh + 'px'; m.style.left = c * 6 + 'px'; m.style.top = (C - 1 - c) * 6 + 'px'; box.append(m); }
  return box;
}
function bars(t, max) {

  return g == null ? null : el('div', 'io', el('div', 'lab', el('span', '', '梯度 ∂损失/∂这份数据'), el('span', 'mono', '范数 ' + (g >= 0.001 ? g.toFixed(4) : g.toExponential(1)))),
    leaf.grad?.data ? viz(leaf.grad) : null, small('反向传播回到这里时的梯度。颜色越深，说明这里稍微变一点，损失就变得越多。'));
}
function detail() {
  const cur = V.ops[step - 1], col = (title, ...body) => el('div', 'col', el('h3', '', title), body);
  if (!cur) {
    $('detail').replaceChildren(...leaves.filter(isInput).map(l => col(l.name, el('p', '', descOf(l)), io(l, '数据'), l.note ? el('p', 'cap', l.note) : null, gradOf(l))));
    return $('cap').replaceChildren(el('b', '', '起点。'), SPEC.example || '这些是送进来的数据，还没有经过任何处理。');
  }
  // what comes in: data from other boxes, and any input that enters inside this one
  const ins = V.data.filter(d => d.cons.includes(cur)).map(d => d.leaf).concat(leaves.filter(l => isInput(l) && rep(l) === cur));
  const made = V.data.filter(d => d.prod === cur), exp = isGroup(cur) && el('button', '', '展开看里面');
  if (exp) exp.onclick = () => toggle(cur);
  $('detail').replaceChildren(
    col('进来', ins.length ? ins.map(l => io(l, '来自 ' + l.name)) : small('这一步没有输入数据。')),
    col('这一步', el('h2', '', cur.name), el('div', 'mono', [cur.type, cur.src].filter(Boolean).join(' · ')), el('p', '', descOf(cur)),
      exp && [small('里面依次是：' + cur.children.map(c => c.name).join(' → ')), el('div', '', exp)]),
    col('出去', made.map(d => [io(d.leaf, made.length > 1 || isGroup(cur) ? d.leaf.name + ' 的输出' : '输出'),
      ...Object.entries(d.leaf.also || {}).map(([k, t]) => io({ out: t }, k)), gradOf(d.leaf)])));
  $('cap').replaceChildren(el('b', '', `第 ${step} 步，共 ${V.ops.length} 步：${cur.name}。`), cur.note || '');
}
function ui() {
  const K = V.ops.length;
  $('step').max = K; $('step').value = step; $('first').disabled = $('prev').disabled = !step; $('next').disabled = step === K;
  $('play').textContent = timer ? '⏸ 暂停' : '▶ 播放';
  $('pos').textContent = step ? `第 ${step} 步，共 ${K} 步` : `起点，共 ${K} 步`;
}
const stop = () => { clearInterval(timer); timer = 0; };
function to(i) { step = Math.max(0, Math.min(V.ops.length, i)); paint(true); detail(); ui(); }
function go(i) { stop(); to(i); }
function play() {
  if (timer) { stop(); return ui(); }
  to(step >= V.ops.length ? 0 : step + 1);
  timer = setInterval(() => { if (step >= V.ops.length - 1) stop(); to(step + 1); }, T);
  ui();
}
function toggle(n) { stop(); open.has(n) ? open.delete(n) : open.add(n); build(); }
function setLevel(L) {
  stop(); open = new Set(groups.filter(g => levelOf(g) <= L && !folded(g))); open.add(SPEC.root);
  $('lvl').textContent = SPEC.levels?.[L - 1] ?? `第 ${L} 级，共 ${maxLevel} 级`;
  build();
}

// ---- export: the figure as it stands (level, open modules) redrawn as plain SVG shapes, for a paper or a slide.
// Everything is measured off the page, so positions and line breaks are the ones on screen. All in ink: no current step.
function figureSvg() {
  const stage = $('stage'), base = stage.getBoundingClientRect(), css = getComputedStyle(document.documentElement), tok = k => css.getPropertyValue(k).trim();
  const ink = tok('--ink'), pencil = tok('--pencil'), paper = tok('--paper'), n = v => +v.toFixed(1), esc = s => s.replace(/[&<>]/g, c => `&#${c.charCodeAt(0)};`);
  const at = r => [n(r.left - base.left), n(r.top - base.top), n(r.width), n(r.height)], box = e => at(e.getBoundingClientRect());
  const rect = ([x, y, w, h], a) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" ${a}/>`;
  const image = (e, href) => { const [x, y, w, h] = box(e); return `<image href="${href}" x="${x}" y="${y}" width="${w}" height="${h}" preserveAspectRatio="none"/>`; };
  // heat maps are a few pixels across: enlarge them here, so no viewer gets to blur them
  const big = c => { const s = Math.ceil(160 / Math.max(c.width, c.height)), b = el('canvas'); b.width = c.width * s; b.height = c.height * s; const x = b.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(c, 0, 0, b.width, b.height); return b.toDataURL(); };
  const out = [];
  for (const e of G.nodes) e.dataset.s = 'done';
  for (const f of stage.querySelectorAll('.frame')) {     // a module: one piece per row, left open where a row break cuts it
    const rs = [...f.getClientRects()].map(at);
    rs.forEach(([x, y, w, h], i) => {
      const L = i > 0, R = i < rs.length - 1, r = x + w, b = y + h;
      out.push(rect([x, y, w, h], `fill="${ink}" fill-opacity=".035"`), `<path d="M${x + (L ? 0 : 8)},${y}H${r - (R ? 0 : 8)}${R ? `M${r},${b}` : `Q${r},${y} ${r},${y + 8}V${b - 8}Q${r},${b} ${r - 8},${b}`}H${x + (L ? 0 : 8)}${L ? '' : `Q${x},${b} ${x},${b - 8}V${y + 8}Q${x},${y} ${x + 8},${y}`}" fill="none" stroke="${pencil}" stroke-width="1.5" stroke-dasharray="5 4"/>`);
    });
  }
  for (const l of stage.querySelectorAll('.glabel')) out.push(rect(box(l), `fill="${paper}"`));
  for (const c of stage.querySelectorAll('.card')) {
    const [x, y, w, h] = box(c), head = c.querySelector('.head'), hh = box(head)[3], r = x + w;
    if (c.classList.contains('group')) out.push(rect([x + 5, y + 5, w, h], `rx="4" fill="${paper}" stroke="${pencil}"`));
    out.push(rect([x, y, w, h], `rx="4" fill="${paper}"`));
    if (!c.classList.contains('in')) out.push(`<path d="M${x},${y + hh}V${y + 4}Q${x},${y} ${x + 4},${y}H${r - 4}Q${r},${y} ${r},${y + 4}V${y + hh}z" fill="${getComputedStyle(head).backgroundColor}"/>`);
    for (const m of c.querySelectorAll('canvas, img')) out.push(m.closest('.stack') ? rect(box(m), `fill="${paper}" stroke="${ink}"`) : '', image(m, m.src || big(m)));
    out.push(rect([x, y, w, h], `rx="4" fill="none" stroke="${ink}" stroke-width="1.5"`));
  }
  // text: one <text> per line as the browser broke it, found by asking where each character sits
  const pen = el('canvas').getContext('2d'), range = document.createRange(), walk = document.createTreeWalker(stage, NodeFilter.SHOW_TEXT);
  for (let t; (t = walk.nextNode());) {
    const p = t.parentElement, cs = getComputedStyle(p), clip = p.closest('.head')?.getBoundingClientRect();
    if (p.closest('.exp, .glabel span')) continue;
    pen.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const m = pen.measureText('x'), up = m.fontBoundingBoxAscent / (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent);
    for (let i = 0, line = null; i <= t.length; i++) {
      const r = i < t.length ? (range.setStart(t, i), range.setEnd(t, i + 1), range.getBoundingClientRect()) : null;
      if (line && (!r || Math.abs(r.top - line.top) > 2)) {
        const mid = line.top + line.h / 2;
        if (line.s.trim() && !(clip && (mid < clip.top || mid > clip.bottom))) out.push(`<text x="${n(line.left - base.left)}" y="${n(line.top - base.top + line.h * up)}" font-family="${cs.fontFamily.replace(/"/g, "'")}" font-size="${cs.fontSize}" font-weight="${cs.fontWeight}" fill="${cs.color}" xml:space="preserve">${esc(line.s)}</text>`);
        line = null;
      }
      if (r && r.width) line ? line.s += t.data[i] : line = { s: t.data[i], left: r.left, top: r.top, h: r.height };
    }
  }
  for (const w of G.wires) out.push(`<path d="${w.d}" fill="none" stroke="${ink}" stroke-width="1.5" marker-end="url(#a)"/>`);
  paint(false);
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.ceil(base.width)}" height="${Math.ceil(base.height)}" viewBox="0 0 ${Math.ceil(base.width)} ${Math.ceil(base.height)}">` +
    `<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 1L10 5L0 9z" fill="${ink}"/></marker></defs>${out.join('')}</svg>`;
}
// A page published on claude.ai may not start a download itself: there the viewer's `downloads` capability saves the
// file after asking, and where that is missing too the button goes. Opened as a file, a plain download link does it.
const saver = window.claude ? window.claude.use('downloads') : null;
saver?.then(d => { if (!d) $('export').hidden = true; });
$('export').onclick = async () => {
  const filename = (SPEC.title || 'model-flow').replace(/[\\/:*?"<>|]/g, ' ') + '.svg', data = figureSvg(), d = await saver;
  if (d) return d.save({ filename, data }).catch(() => {});   // the viewer may say no
  const a = el('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'image/svg+xml' })); a.download = filename;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};

// ---- variants: the same steps traced again (other weights, another sample). Picking one swaps the data and the words in.
const VAR = SPEC.variants, EXAMPLE = SPEC.example;
function pick(i) {
  const v = VAR.items[i];
  for (const id in v.nodes) Object.assign(byId.get(id), v.nodes[id]);
  SPEC.example = v.example ?? EXAMPLE;
  $('variant').value = i; $('vname').textContent = v.name; $('example').textContent = SPEC.example ? '跟踪的实例：' + SPEC.example : '';
}

document.title = SPEC.title || document.title;
$('title').textContent = SPEC.title || ''; $('src').textContent = SPEC.source || ''; $('summary').textContent = SPEC.summary || '';
$('example').textContent = SPEC.example ? '跟踪的实例：' + SPEC.example : '';
if (VAR) {
  $('vctl').hidden = false; $('vlab').textContent = VAR.label || '版本'; $('variant').max = VAR.items.length - 1;
  $('variant').oninput = e => { stop(); pick(+e.target.value); build(); };
  pick(VAR.items.length - 1);
}
$('level').max = maxLevel; $('level').value = Math.min(2, maxLevel);
$('level').oninput = e => setLevel(+e.target.value);
$('step').oninput = e => go(+e.target.value);
$('play').onclick = play; $('first').onclick = () => go(0); $('prev').onclick = () => go(step - 1); $('next').onclick = () => go(step + 1);
addEventListener('keydown', e => {
  if (e.target.matches('input, button')) return;
  if (e.key === 'ArrowRight') go(step + 1); else if (e.key === 'ArrowLeft') go(step - 1); else if (e.key === ' ') { e.preventDefault(); play(); }
});
setLevel(+$('level').value);
let seenW = $('stage').clientWidth;
new ResizeObserver(() => { const w = $('stage').clientWidth; if (w !== seenW) { seenW = w; stop(); wire(); ui(); } }).observe($('stage'));
</script>
