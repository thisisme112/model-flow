<!doctype html>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
/* Layout: one framework figure across the page — boxes are operations, the small pictures between them are data.
   Controls sit above it; the current step's input / operation / output is spelled out below.
   Single paper look by choice. Restyle by changing the tokens below. */
:root { color-scheme: light;
  --paper: #f7f6f1; --grid: #e4e9ee; --ink: #1b2a41; --pencil: #6f7782; --red: #c8372d;
  --k-conv: #d6e4f5; --k-pool: #d5ecdb; --k-dense: #e5dbf3; --k-act: #f7eabb; --k-norm: #e9e5da; --k-attn: #f8d8cf;
  --k-shape: #e0e3e6; --k-loss: #f5cfca; --k-group: #fdfcf8; --k-other: #fdfcf8;
  --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --kai: "LXGW WenKai", "KaiTi", "STKaiti", "Kaiti SC", "Noto Serif SC", serif;
  --mono: "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box }
body { margin: 0; color: var(--ink); font: 16px/1.75 var(--serif); font-variant-numeric: tabular-nums; padding-block: 2rem 4rem; padding-inline: 16px;
  background: linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 24px, linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 100%, var(--paper) }
.page { max-width: 82rem; margin-inline: auto; display: grid; gap: 1.5rem; grid-template-columns: minmax(0, 1fr) }
h1 { font-weight: 900; font-size: clamp(1.6rem, 4vw, 2.3rem); line-height: 1.25; margin: 0; text-wrap: balance }
h2 { font-weight: 600; font-size: 1.25rem; line-height: 1.3; margin: 0; overflow-wrap: anywhere }
p { margin: 0 }
.src { font-size: .8rem; letter-spacing: .12em; color: var(--pencil) }
.lede { max-width: 40em; margin-top: .5rem }
.small { font-size: .8rem; color: var(--pencil); line-height: 1.5 }
.mono { font-family: var(--mono); font-size: .78rem }
button { font: inherit; color: var(--ink); background: var(--paper); border: 1.5px solid var(--ink); border-radius: 2px; padding: .1rem .75rem; cursor: pointer }
button:disabled { color: var(--pencil); border-color: var(--pencil); cursor: default }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px }
input[type=range] { accent-color: var(--red) }
canvas, img { image-rendering: pixelated; display: block; max-width: 100%; height: auto }

.bar { display: flex; flex-wrap: wrap; gap: .8rem 2.5rem; align-items: center }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .6rem; font-size: .9rem }
.ctl label { font-weight: 600 }
#level { width: 8rem }
#step { width: 10rem }
#play { background: var(--ink); color: var(--paper); min-width: 5.4rem }

/* hand-inked outline on a pseudo-element, so the contents stay sharp */
.inked { position: relative }
.inked::before, .card::before { content: ""; position: absolute; inset: 0; border: 1.5px solid var(--ink); border-radius: 4px; filter: url(#rough); pointer-events: none }

/* The figure is laid out like text: steps are inline boxes that wrap at the page edge, and a module is an inline
   span around its steps, so a module that does not fit on one row carries on in the next with its frame left open.
   --nt / --nb: room each row keeps above / below its centre line; --shift: half their difference, because a frame
   hangs from the row's baseline, which sits that far above the centre line. --h: how many frame levels a frame has inside it. */
.wrap { overflow-x: auto; overflow-y: hidden }
.stage { position: relative; font-size: 0; line-height: 0; padding-block: 10px }
#wires { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none }
.frame { position: relative; padding: calc(77px + var(--h) * 12px - var(--shift)) 6px calc(61px + var(--h) * 6px + var(--shift)); border: 1.5px dashed var(--pencil); border-radius: 8px; background: rgba(27, 42, 65, .035) }
#wires .w { fill: none; stroke: var(--ink); stroke-width: 1.5; marker-end: url(#ah) }
#wires .w[data-s=todo] { stroke: var(--pencil); opacity: .35; marker-end: url(#ah-todo) }
#wires .w[data-s=now] { stroke: var(--red); stroke-width: 2; marker-end: url(#ah-now) }
.glabel { position: absolute; left: 8px; top: 0; transform: translateY(-50%); background: var(--paper); border: 0; padding: 0 .4rem; font: 600 12px/1.4 var(--serif); white-space: nowrap }
.glabel span { color: var(--pencil); font-weight: 400 }
.card { position: relative; display: inline-block; vertical-align: middle; width: 84px; height: 106px; margin: calc(var(--nt) - 53px) 10px calc(var(--nb) - 53px); background: var(--paper); border-radius: 4px }
.card.group { box-shadow: 5px 5px 0 -1px var(--paper), 5px 5px 0 0 var(--pencil) }
.card .pick { width: 100%; height: 100%; display: grid; grid-template-rows: 34px 1fr auto; justify-items: center; align-items: center; border: 0; background: none; padding: 0 0 4px; font: 10px/1.2 var(--mono); color: var(--pencil) }
.card .head { align-self: stretch; justify-self: stretch; display: grid; place-content: center; overflow: hidden; padding: 0 3px; background: var(--k); border-radius: 4px 4px 0 0; font: 600 12px/1.15 var(--serif); color: var(--ink); text-align: center; overflow-wrap: anywhere }
.card .head small { display: block; font: 400 9.5px/1.25 var(--mono); color: var(--pencil) }
.card.in .head { background: none }
.card .exp { position: absolute; right: -9px; top: -9px; width: 20px; height: 20px; border-radius: 50%; padding: 0; display: grid; place-items: center; font: 600 13px/1 var(--mono) }
.card[data-s=todo] { opacity: .28 }
.card[data-s=now]::before { border-color: var(--red); border-width: 2.5px }
.card[data-s=now] .head { color: var(--red) }
.thumb { width: 60px; height: 54px; display: grid; place-items: center }
.thumb img { max-width: 56px; max-height: 56px; image-rendering: auto }
.thumb .num { font: 600 17px var(--serif); color: var(--ink) }
.thumb .tk { font-size: 10px; color: var(--ink); text-align: center; overflow-wrap: anywhere }
.stack { position: relative }
.stack canvas { position: absolute; background: var(--paper); outline: 1px solid var(--ink) }
.dot { position: absolute; left: 0; top: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--red); opacity: 0; offset-rotate: 0deg; pointer-events: none }

.legend { display: flex; flex-wrap: wrap; gap: .3rem 1.2rem; font-size: .8rem; color: var(--pencil) }
.legend i { display: inline-block; width: .9rem; height: .9rem; margin-right: .35rem; vertical-align: -2px; border: 1px solid var(--ink); border-radius: 2px; background: var(--k) }
figcaption, .cap { max-width: 42em; font-size: .95rem }
figure { margin: 0; display: grid; gap: .6rem; min-width: 0 }

.detail { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap: 1.2rem 0; padding: 1.2rem 0; background: color-mix(in srgb, var(--paper) 88%, transparent) }
.col { padding: 0 1.2rem; display: grid; gap: .8rem; align-content: start; min-width: 0; border-left: 1px dashed var(--pencil) }
.col:first-child { border-left: 0 }
.col h3 { margin: 0; font-size: .8rem; font-weight: 400; letter-spacing: .15em; color: var(--pencil) }
.io { display: grid; gap: .4rem; min-width: 0 }
.lab { display: flex; justify-content: space-between; gap: .6rem; font-size: .8rem; color: var(--pencil) }
.lab span:first-child { color: var(--ink); font-weight: 600 }
.maps { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start }
.maps canvas { outline: 1px solid var(--grid) }
.scroll { overflow-x: auto }
.ngrid { display: grid; gap: 1px; width: max-content }
.ngrid span { font: 10px/1.5 var(--mono); min-width: 2.2rem; padding: 0 .2rem; text-align: right; outline: 1px solid var(--grid) }
.big { font-size: 2.6rem; font-weight: 900; line-height: 1.1 }
.bars { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: .2rem .5rem; align-items: center; font: .78rem/1.2 var(--mono) }
.bars .track { position: relative; height: .8rem }
.bars i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--ink) }
.bars i.neg { background: var(--red) }
.bars.signed .track { background: linear-gradient(var(--pencil), var(--pencil)) 50% 0 / 1px 100% no-repeat }
.bars .v { text-align: right }
.tokens { display: flex; flex-wrap: wrap; gap: .3rem }
.tokens span { font: .8rem var(--mono); border: 1px solid var(--pencil); padding: 0 .4rem; border-radius: 3px }
.cap { font-family: var(--kai); font-size: 1.08rem }
.cap b { font-family: var(--serif); font-size: .95rem; font-weight: 600 }
</style>

  ['norm', /norm|dropout/i, '归一化 / Dropout'], ['act', /relu|gelu|silu|swish|sigmoid|tanh|softmax/i, '激活'], ['dense', /linear|dense|embed|matmul|bmm/i, '全连接 / 嵌入'],

  input: '送进来的原始数据。', conv: '卷积：用小窗口（卷积核）在输入上滑动，每个位置算一次加权和，用来找局部图案。',
  convtranspose: '转置卷积：和卷积相反，把特征图放大。', relu: '激活函数：负数变成 0，正数不变。', gelu: '激活函数：和 ReLU 类似，但在 0 附近是平滑过渡。',

// ---- playback: everything on screen is a function of `step` (0 = only the inputs exist yet)

$('title').textContent = SPEC.title || ''; $('src').textContent = SPEC.source || ''; $('summary').textContent = SPEC.summary || '';
$('example').textContent = SPEC.example ? '跟踪的实例：' + SPEC.example : '';
$('level').max = maxLevel; $('level').value = Math.min(2, maxLevel);
